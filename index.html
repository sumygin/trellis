<!DOCTYPE html>
<html lang="en">
<head>
     <link rel="icon" href="favicon.png" type="image/png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 
  <title>Trellis</title>
  <style>
    :root {
      --bg-default: #0d0f10;
      --list-bg: rgba(18, 20, 18, 0.92);
      --card-bg: #222528;
      --card-hover: #2b2f33;
      --text-main: #e6e8ea;
      --text-muted: #9fadbc;
      --border-subtle: rgba(255, 255, 255, 0.08);
      /* 5-Tier Due Date Pill Colors */
      --due-red: #8f211b;       /* Due today or overdue */
      --due-tomorrow: #c9372c;  /* Due tomorrow */
      --due-orange: #e56910;    /* Next 3 days */
      --due-yellow: #f5cd47;    /* Next week */
      --due-green: #579dff;     /* Within a month */
      --due-lightblue: #579dff; /* Later */
      --done-green: #6cc04a;    /* Completed pill (matches screenshot) */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-default);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* Top Minimalist Bar */
    header {
      height: 48px;
      background: rgba(10, 12, 14, 0.78);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-right: 6px;
      color: var(--text-main);
      text-decoration: none;
      white-space: nowrap;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      object-fit: cover;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand-byline {
      color: #777b85;
      font-size: 15px;
      font-weight: 500;
    }

    select, button, input[type="text"], input[type="datetime-local"], textarea {
      background: #1d2023;
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
    }

    button {
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover {
      background: #2c3136;
    }

    /* Horizontal Board Canvas */
    #board-canvas {
      flex: 1;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px;
      overflow-x: auto;
      overflow-y: hidden;
    }

    /* List Column */
    .list {
      width: 272px;
      max-height: calc(100vh - 80px);
      background: var(--list-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      padding: 10px 8px;
    }

    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 8px 10px;
      font-weight: 600;
      font-size: 13px;
      cursor: grab;
    }

    .list-header:active { cursor: grabbing; }
    .list.list-dragging { opacity: 0.45; }
    .list.list-drag-over { border-color: var(--due-lightblue); }

    .list-title {
      cursor: pointer;
      flex: 1;
    }

    .list-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-weight: 400;
      font-size: 12px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 2px 5px;
      font-size: 14px;
    }

    .icon-btn:hover {
      color: var(--text-main);
      background: rgba(255,255,255,0.08);
    }

    /* Cards Container */
    .cards-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 2px 4px;
      min-height: 24px;
    }

    .cards-container.drag-over {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 6px;
    }

    /* Card Item */
    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 10px 10px 8px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.12s, transform 0.1s;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .card:hover {
      background: var(--card-hover);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .card.dragging {
      opacity: 0.45;
    }

    .card-cover {
      width: 100%;
      max-height: 135px;
      object-fit: cover;
      border-radius: 5px;
      margin-bottom: 2px;
      background: #141618;
    }

    .card-header-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13.5px;
      line-height: 1.35;
      word-break: break-word;
    }

    /* Complete Circle Toggle */
    .complete-toggle {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1.5px solid var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
      cursor: pointer;
      font-size: 10px;
      color: transparent;
      transition: all 0.15s;
    }

    .card:hover .complete-toggle,
    .complete-toggle.completed {
      border-color: var(--done-green);
    }

    .complete-toggle.completed {
      background: var(--done-green);
      color: #0d0f10;
      font-weight: bold;
    }

    .card-title a {
      color: #579dff;
      text-decoration: underline;
    }

    /* Card Badges Row */
    .card-badges {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .due-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
      font-size: 11px;
      color: #fff;
    }

    .due-pill.tier-red { background: var(--due-red); color: #fff; }
    .due-pill.tier-tomorrow { background: var(--due-tomorrow); color: #fff; }
    .due-pill.tier-orange { background: var(--due-orange); color: #fff; }
    .due-pill.tier-yellow { background: var(--due-yellow); color: #171a1c; font-weight: 600; }
    .due-pill.tier-green { background: var(--due-green); color: #0f1214; font-weight: 600; }
    .due-pill.tier-lightblue { background: var(--due-lightblue); color: #0f1214; font-weight: 600; }
    .due-pill.completed { background: var(--done-green); color: #0f1214; font-weight: 600; }

    .badge-item {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    /* Add Card Footer */
    .add-card-btn {
      margin-top: 6px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      text-align: left;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 13px;
    }

    .add-card-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
    }

    .add-card-form {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 0 4px;
    }

    .add-card-form textarea {
      width: 100%;
      resize: none;
      height: 58px;
      background: var(--card-bg);
    }

    .add-list-btn {
      width: 272px;
      flex-shrink: 0;
      background: rgba(18, 20, 18, 0.72);
      border: 1px dashed var(--border-subtle);
      color: var(--text-muted);
      padding: 12px;
      border-radius: 10px;
      text-align: left;
    }

    /* Modal Backdrop */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: #1a1d20;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      width: 100%;
      max-width: 580px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .modal-header input {
      flex: 1;
      font-size: 16px;
      font-weight: 600;
    }

    .modal-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .modal-section label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .checklist-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      padding: 4px 0;
    }

    .checklist-item.done span {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .danger-btn {
      background: #5c1f1a;
      border-color: #8a2be200;
      color: #ff9b93;
    }
    .danger-btn:hover {
      background: #7a2923;
    }

    .status-text { color: var(--text-muted); font-size: 12px; }
    .user-chip { color: var(--text-muted); font-size: 12px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
    .auth-modal { max-width: 420px; }
    .auth-modal input, .auth-modal select { width: 100%; }
    .invite-row { padding: 10px; border: 1px solid var(--border-subtle); border-radius: 7px; display:flex; justify-content:space-between; gap:10px; align-items:center; }

    @media (max-width: 700px) {
      header {
        height: auto;
        min-height: 48px;
        align-items: stretch;
        gap: 8px;
        padding: 8px 10px;
      }

      .header-left, .header-right {
        min-width: 0;
        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .header-left::-webkit-scrollbar, .header-right::-webkit-scrollbar {
        display: none;
      }

      .header-left > *, .header-right > * {
        flex-shrink: 0;
      }

      .brand {
        margin-right: 2px;
      }

      #board-canvas {
        gap: 10px;
        padding: 10px;
      }

      .list {
        max-height: calc(100vh - 140px);
      }
    }

    @media (max-width: 440px) {
      .brand-byline {
        display: none;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <a class="brand" href="/" aria-label="Trellis home">
        <img class="brand-mark" src="favicon.png" alt="" aria-hidden="true">
        <span class="brand-name">trellis</span>
        <span class="brand-byline">by makxyak</span>
      </a>
      <select id="board-select" onchange="switchBoard(this.value)"></select>
      <button onclick="createNewBoard()">+ Board</button>
      <button onclick="deleteCurrentBoard()" title="Delete Board">🗑</button>
      <button onclick="openInviteModal()">Invite</button>
    </div>
    <div class="header-right">
      <span class="user-chip" id="user-chip">Local mode</span>
      <button id="auth-button" onclick="openAuthModal()">Sign in</button>
      <label for="bg-upload" style="cursor:pointer; background:#1d2023; border:1px solid var(--border-subtle); padding:6px 10px; border-radius:6px; font-size:13px;">
        Upload BG Image
      </label>
      <input type="file" id="bg-upload" accept="image/*" style="display:none" onchange="uploadBackground(this)" />
      <button onclick="clearBackground()">Clear BG</button>
    </div>
  </header>

  <main id="board-canvas"></main>

  <!-- Card Detail Modal -->
  <div class="modal-backdrop" id="card-modal" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <div class="modal-header">
        <input type="text" id="modal-title" onchange="saveModalTitle()" />
        <button onclick="closeModal()">✕</button>
      </div>

      <div class="modal-section">
        <label>Due Date & Time</label>
        <div class="row">
          <input type="datetime-local" id="modal-due" onchange="updateModalDue(this.value)" />
          <button onclick="updateModalDue('')">Clear Due Date</button>
        </div>
      </div>

      <div class="modal-section">
        <label>Description (supports clickable links)</label>
        <textarea id="modal-desc" rows="4" placeholder="Add a more detailed description..." onchange="saveModalDesc()"></textarea>
        <div id="modal-desc-links" style="font-size:12.5px; color:var(--text-muted);"></div>
      </div>

      <div class="modal-section">
        <label>Hyperlinks & Attached Link Image</label>
        <div class="row">
          <input type="text" id="modal-link-input" placeholder="Paste https:// link..." style="flex:1" />
          <button onclick="addCardLink()">Attach Link</button>
        </div>
        <div id="modal-links-list" style="display:flex; flex-direction:column; gap:6px; font-size:13px;"></div>
      </div>

      <div class="modal-section">
        <label id="modal-checklist-label">Checklist</label>
        <div id="modal-checklist-items"></div>
        <div class="row">
          <input type="text" id="new-check-item" placeholder="Add checklist item..." style="flex:1" onkeydown="if(event.key==='Enter') addChecklistItem()" />
          <button onclick="addChecklistItem()">Add</button>
        </div>
      </div>

      <div class="row" style="justify-content:space-between; margin-top:8px;">
        <button class="danger-btn" onclick="deleteActiveCard()">Delete Card</button>
        <button onclick="closeModal()">Done</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="auth-modal" onclick="if(event.target===this) closeAuthModal()">
    <div class="modal auth-modal">
      <div class="modal-header"><strong>Account</strong><button onclick="closeAuthModal()">✕</button></div>
      <div id="auth-login-fields">
        <div class="modal-section"><label>Email</label><input id="auth-email" type="email" autocomplete="email" placeholder="you@example.com"></div>
        <div class="modal-section"><label>Password</label><input id="auth-password" type="password" autocomplete="current-password" placeholder="At least 6 characters"></div>
        <button onclick="signInWithGoogle()">Continue with Google</button>
        <div class="status-text" style="text-align:center;">or use email and password</div>
        <div class="row"><button onclick="signIn()">Sign in</button><button onclick="signUp()">Create account</button></div>
      </div>
      <div class="status-text" id="account-status"></div>
      <span class="status-text" id="auth-status">Use an account to sync boards across devices.</span>
      <div class="status-text"><a href="/privacy" target="_blank" rel="noopener noreferrer">Privacy Policy</a> · <a href="/terms" target="_blank" rel="noopener noreferrer">Terms of Service</a></div>
      <div id="account-invites"></div>
      <button id="sign-out-button" class="danger-btn" onclick="signOut()" style="display:none">Sign out</button>
    </div>
  </div>

  <div class="modal-backdrop" id="invite-modal" onclick="if(event.target===this) closeInviteModal()">
    <div class="modal auth-modal">
      <div class="modal-header"><strong>Board access</strong><button onclick="closeInviteModal()">✕</button></div>
      <div class="modal-section">
        <label>Invite a member</label>
        <input id="invite-email" type="email" placeholder="member@example.com">
        <select id="invite-role"><option value="editor">Editor — can edit cards</option><option value="commenter">Commenter — can add notes</option><option value="viewer">Viewer — read only</option></select>
        <button onclick="sendInvite()">Send invitation</button>
        <span class="status-text" id="invite-status"></span>
      </div>
      <div class="modal-section"><label>Pending invitations</label><div id="pending-invites"></div></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Supabase is loaded from the official browser bundle; local mode remains available.
    const SUPABASE_CDN = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
    let state = null;
    let supabaseClient = null;
    let authUser = null;
    let boardMemberships = {};
    let realtimeChannel = null;
    let activeCardRef = null; // { listId, cardId }
    let draggedCardRef = null; // { sourceListId, cardId }
    let draggedListId = null;

    function activeBoardStorageKey() {
      return `trellis-active-board:${authUser?.id || "local"}`;
    }

    function rememberActiveBoard(boardId) {
      if (boardId) localStorage.setItem(activeBoardStorageKey(), boardId);
    }

    function restoreActiveBoard(boards) {
      const rememberedId = localStorage.getItem(activeBoardStorageKey());
      const rememberedBoard = boards.find((board) => board.id === rememberedId);
      return rememberedBoard?.id || boards[0]?.id || null;
    }

    // --- 1. NATURAL LANGUAGE DATE & TIME PARSER ---
    function parseNaturalLanguageDate(rawTitle) {
      let text = rawTitle;
      const now = new Date();
      let matchedDate = null;
      let matchedTokens = [];

      // Step A: Parse optional explicit time (e.g., "16:10", "7:30", "3pm", "7am", "7:30pm")
      let hours = 0, minutes = 0;
      const timeRegex = /\b(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/gi;
      let timeMatch;
      while ((timeMatch = timeRegex.exec(text)) !== null) {
        const fullToken = timeMatch[0];
        const hRaw = parseInt(timeMatch[1], 10);
        const mRaw = timeMatch[2] !== undefined ? parseInt(timeMatch[2], 10) : null;
        const mer = timeMatch[3] ? timeMatch[3].toLowerCase() : null;

        // Only treat as time if it has :mm OR am/pm
        if (mRaw !== null || mer !== null) {
          if (hRaw >= 0 && hRaw <= 23 && (mRaw === null || (mRaw >= 0 && mRaw <= 59))) {
            hours = hRaw;
            minutes = mRaw || 0;
            if (mer === "pm" && hours < 12) hours += 12;
            if (mer === "am" && hours === 12) hours = 0;
            matchedTokens.push(fullToken);
            break;
          }
        }
      }

      const monthNames = {
        jan: 0, january: 0, feb: 1, february: 1, mar: 2, march: 2,
        apr: 3, april: 3, may: 4, jun: 5, june: 5, jul: 6, july: 6,
        aug: 7, august: 7, sep: 8, sept: 8, september: 8,
        oct: 9, october: 9, nov: 10, november: 10, dec: 11, december: 11
      };

      const dayNames = {
        sun: 0, sunday: 0, mon: 1, monday: 1, tue: 2, tues: 2, tuesday: 2,
        wed: 3, wednesday: 3, thu: 4, thur: 4, thurs: 4, thursday: 4,
        fri: 5, friday: 5, sat: 6, saturday: 6
      };

      // Step B: Date patterns (ordered from specific to general)
      const patterns = [
        // 1. "today" / "tomorrow"
        {
          regex: /\b(today|tomorrow)\b/i,
          handler: (m) => {
            const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            if (m[1].toLowerCase() === "tomorrow") d.setDate(d.getDate() + 1);
            return d;
          }
        },
        // 2. "next week" -> Monday (first day) of next week
        {
          regex: /\bnext\s+week\b/i,
          handler: () => {
            const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const day = d.getDay(); // 0=Sun, 1=Mon...
            const diffToNextMon = ((8 - (day === 0 ? 7 : day)) % 7) || 7;
            d.setDate(d.getDate() + diffToNextMon);
            return d;
          }
        },
        // 3. "next month" -> 1st of next month
        {
          regex: /\bnext\s+month\b/i,
          handler: () => new Date(now.getFullYear(), now.getMonth() + 1, 1)
        },
        // 4. DD/MM or DD/MM/YYYY (e.g. 26/10 or 26/10/2026)
        {
          regex: /\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/,
          handler: (m) => {
            const day = parseInt(m[1], 10);
            const month = parseInt(m[2], 10) - 1;
            let year = m[3] ? parseInt(m[3], 10) : now.getFullYear();
            if (year < 100) year += 2000;
            if (month < 0 || month > 11 || day < 1 || day > 31) return null;
            const candidate = new Date(year, month, day);
            if (!m[3] && candidate < new Date(now.getFullYear(), now.getMonth(), now.getDate())) {
              candidate.setFullYear(year + 1);
            }
            return candidate;
          }
        },
        // 5. "25 Oct" or "Oct 25"
        {
          regex: /\b(?:(\d{1,2})\s+(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t|tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)|(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t|tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\s+(\d{1,2}))\b/i,
          handler: (m) => {
            const day = parseInt(m[1] || m[4], 10);
            const mName = (m[2] || m[3]).toLowerCase();
            const month = monthNames[mName];
            let year = now.getFullYear();
            const candidate = new Date(year, month, day);
            if (candidate < new Date(now.getFullYear(), now.getMonth(), now.getDate())) {
              candidate.setFullYear(year + 1);
            }
            return candidate;
          }
        },
        // 6. Standalone Month name (e.g. "november", "october") -> defaults to 1st of that month
        {
          regex: /\b(january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sep|sept|oct|nov|dec)\b/i,
          handler: (m) => {
            const month = monthNames[m[1].toLowerCase()];
            let year = now.getFullYear();
            let candidate = new Date(year, month, 1);
            if (candidate < new Date(now.getFullYear(), now.getMonth(), now.getDate())) {
              candidate = new Date(year + 1, month, 1);
            }
            return candidate;
          }
        },
        // 7. Day of week (e.g., "mon", "tue", "wed", "friday")
        {
          regex: /\b(?:next\s+|on\s+)?(mon(?:day)?|tue(?:s|sday)?|wed(?:nesday)?|thu(?:r|rs|rsday)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?)\b/i,
          handler: (m) => {
            const targetDay = dayNames[m[1].toLowerCase()];
            const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            let diff = (targetDay - d.getDay() + 7) % 7;
            if (diff === 0) diff = 7;
            d.setDate(d.getDate() + diff);
            return d;
          }
        }
      ];

      for (const p of patterns) {
        const match = text.match(p.regex);
        if (match) {
          const d = p.handler(match);
          if (d) {
            matchedDate = d;
            matchedTokens.push(match[0]);
            break;
          }
        }
      }

      if (!matchedDate) return { cleanTitle: rawTitle.trim(), dueISO: null };

      matchedDate.setHours(hours, minutes, 0, 0);

      // Remove matched date & time tokens from card title
      let cleaned = rawTitle;
      for (const tok of matchedTokens) {
        cleaned = cleaned.replace(tok, "");
      }
      cleaned = cleaned.replace(/\s{2,}/g, " ").trim();
      if (!cleaned) cleaned = rawTitle.trim();

      // Format as local YYYY-MM-DDTHH:mm
      const pad = (n) => String(n).padStart(2, "0");
      const dueISO = `${matchedDate.getFullYear()}-${pad(matchedDate.getMonth() + 1)}-${pad(matchedDate.getDate())}T${pad(matchedDate.getHours())}:${pad(matchedDate.getMinutes())}`;

      return { cleanTitle: cleaned, dueISO };
    }

    // --- 2. 5-TIER DUE DATE PILL COLOUR LOGIC ---
    function getDuePillInfo(card) {
      if (!card.due) return null;
      const dueDate = new Date(card.due);
      const now = new Date();

      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const hasNonMidnightTime = dueDate.getHours() !== 0 || dueDate.getMinutes() !== 0;
      const pad = (n) => String(n).padStart(2, "0");
      const label = `${dueDate.getDate()} ${months[dueDate.getMonth()]}${hasNonMidnightTime ? ` ${pad(dueDate.getHours())}:${pad(dueDate.getMinutes())}` : ""}`;

      if (card.completed) {
        return { className: "due-pill completed", text: `✓ ${label}` };
      }

      // Compare calendar day difference from start of today
      const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const startOfDueDay = new Date(dueDate.getFullYear(), dueDate.getMonth(), dueDate.getDate());
      const diffDays = (startOfDueDay - startOfToday) / (1000 * 60 * 60 * 24);

      let tierClass = "tier-lightblue";
      if (diffDays <= 0) {
        tierClass = "tier-red";        // Due today or overdue
      } else if (diffDays === 1) {
        tierClass = "tier-tomorrow";  // Due tomorrow
      } else if (diffDays <= 3) {
        tierClass = "tier-orange";     // In the next 3 days
      } else if (diffDays <= 7) {
        tierClass = "tier-yellow";     // In the next week
      } else if (diffDays <= 30) {
        tierClass = "tier-green";      // Within a month
      } else {
        tierClass = "tier-lightblue";  // Later
      }

      return { className: `due-pill ${tierClass}`, text: label };
    }

    // --- 3. AUTOMATIONS ENGINE ---
    function getActiveBoard() {
      return state.boards.find((b) => b.id === state.activeBoardId) || state.boards[0];
    }

    function ensureListByName(board, targetName, placeFirst = false) {
      let list = board.lists.find((l) => l.name.toLowerCase() === targetName.toLowerCase());
      if (!list) {
        list = { id: "list-" + Date.now() + Math.random().toString(36).slice(2, 6), name: targetName, cards: [] };
        if (placeFirst) board.lists.unshift(list);
        else board.lists.push(list);
      }
      return list;
    }

    // Automation: Sort list by due date ascending (cards without due dates stay at bottom)
    function sortListByDueAscending(list) {
      list.cards.sort((a, b) => {
        if (a.due && b.due) return new Date(a.due) - new Date(b.due);
        if (a.due && !b.due) return -1;
        if (!a.due && b.due) return 1;
        return 0;
      });
    }

    // Automation: Check if any incomplete cards have reached their due moment -> Move to top of "DUE TODAY"
    function runDueMomentAutomations() {
      if (!state) return;
      const board = getActiveBoard();
      if (!board) return;

      const now = new Date();
      const endOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
      let changed = false;

      const dueTodayList = board.lists.find((l) => l.name.toLowerCase() === "due today");

      for (const list of board.lists) {
        if (list.name.toLowerCase() === "due today" || list.name.toLowerCase() === "done") continue;

        for (let i = list.cards.length - 1; i >= 0; i--) {
          const card = list.cards[i];
          if (!card.completed && card.due) {
            const dueTime = new Date(card.due);
            if (dueTime <= now || dueTime <= endOfToday && dueTime <= now) {
              const [moved] = list.cards.splice(i, 1);
              const target = dueTodayList || ensureListByName(board, "DUE TODAY", true);
              target.cards.unshift(moved);
              changed = true;
            }
          }
        }
      }

      if (changed) {
        saveState();
        renderBoard();
      }
    }

    // --- 4. URL DETECTION & IMAGE PREVIEW FETCHER ---
    function extractUrls(text) {
      if (!text) return [];
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      return text.match(urlRegex) || [];
    }

    async function enrichCardWithLinkPreview(card) {
      const urls = [
        ...extractUrls(card.title),
        ...extractUrls(card.description),
        ...(card.links || [])
      ];
      if (urls.length === 0) return;

      for (const u of urls) {
        if (card.coverImage) break;
        try {
          const res = await fetch(`/api/preview?url=${encodeURIComponent(u)}`);
          const data = await res.json();
          if (data.image) {
            card.coverImage = data.image;
            await saveState();
            renderBoard();
            break;
          }
        } catch (e) {}
      }
    }

    // --- 5. DATA PERSISTENCE ---
    async function loadState() {
      try {
        const config = await (await fetch("/api/config")).json();
        if (config.supabaseUrl && config.supabaseAnonKey && window.supabase) {
          supabaseClient = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
          const session = (await supabaseClient.auth.getSession()).data.session;
          authUser = session?.user || null;
          supabaseClient.auth.onAuthStateChange((_event, nextSession) => {
            authUser = nextSession?.user || null;
            updateAccountUi();
            if (authUser) {
              loadSupabaseState().then(renderBoard).catch((error) => alert(`Could not load your boards: ${error.message}`));
            }
          });
        }
      } catch (error) {
        console.warn("Supabase configuration unavailable; using local mode.", error);
      }
      if (authUser) {
        try {
          await loadSupabaseState();
        } catch (error) {
          console.error(error);
          alert(`Could not load your boards: ${error.message}`);
          state = { activeBoardId: "local-board", boards: [{ id: "local-board", name: "Local Board", background: "", lists: [] }] };
        }
      }
      else {
        const res = await fetch("/api/data");
        state = await res.json();
        state.activeBoardId = restoreActiveBoard(state.boards);
        rememberActiveBoard(state.activeBoardId);
      }
      runDueMomentAutomations();
      renderBoard();
      updateAccountUi();
    }

    async function saveState() {
      if (supabaseClient && authUser) {
        const board = getActiveBoard();
        if (!board) return;
        const membership = boardMemberships[board.id];
        if (membership && !["owner", "editor"].includes(membership.role)) {
          alert("You do not have permission to edit this board.");
          return;
        }
        const { error } = await supabaseClient.from("boards").update({
          name: board.name, background: board.background, data: { lists: board.lists }
        }).eq("id", board.id);
        if (error) throw error;
        return;
      }
      await fetch("/api/data", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(state)
      });
    }

    async function loadSupabaseState() {
      const { data, error } = await supabaseClient.from("board_members")
        .select("board_id, role, boards(id, name, background, data)")
        .eq("user_id", authUser.id);
      if (error) throw error;
      boardMemberships = Object.fromEntries((data || []).map((m) => [m.board_id, { role: m.role }]));
      const boards = (data || []).map((m) => ({ id: m.boards.id, name: m.boards.name, background: m.boards.background || "", lists: m.boards.data?.lists || [] }));
      if (!boards.length) {
        const source = {
          name: "Personal Board",
          background: "",
          lists: [
            { id: "list-due-today-" + Date.now(), name: "DUE TODAY", cards: [] },
            { id: "list-to-do-" + Date.now(), name: "To Do", cards: [] },
            { id: "list-done-" + Date.now(), name: "Done", cards: [] }
          ]
        };
        const created = await supabaseClient.rpc("create_board", {
          board_name: source.name,
          board_background: source.background || "",
          board_data: { lists: source.lists }
        });
        if (created.error) throw created.error;
        const createdBoard = created.data;
        state = { activeBoardId: createdBoard.id, boards: [{ id: createdBoard.id, name: createdBoard.name, background: createdBoard.background, lists: source.lists }] };
        boardMemberships[createdBoard.id] = { role: "owner" };
      } else {
        state = { activeBoardId: restoreActiveBoard(boards), boards };
      }
      rememberActiveBoard(state.activeBoardId);
      if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
      realtimeChannel = supabaseClient.channel("trellis-boards").on("postgres_changes", { event: "UPDATE", schema: "public", table: "boards" }, (payload) => {
        const board = state?.boards.find((item) => item.id === payload.new.id);
        if (board && payload.new.updated_at) {
          board.name = payload.new.name; board.background = payload.new.background || ""; board.lists = payload.new.data?.lists || [];
          renderBoard();
        }
      }).subscribe();
    }

    function updateAccountUi() {
      const chip = document.getElementById("user-chip");
      const button = document.getElementById("auth-button");
      const loginFields = document.getElementById("auth-login-fields");
      const accountStatus = document.getElementById("account-status");
      if (authUser) {
        chip.textContent = authUser.email || "Signed in";
        button.textContent = "Account";
        loginFields.style.display = "none";
        accountStatus.textContent = `Signed in as ${authUser.email || "your account"}.`;
      } else {
        chip.textContent = supabaseClient ? "Not signed in" : "Local mode";
        button.textContent = "Sign in";
        loginFields.style.display = "block";
        accountStatus.textContent = "";
      }
    }

    function openAuthModal() {
      updateAccountUi();
      document.getElementById("auth-modal").classList.add("open");
      document.getElementById("sign-out-button").style.display = authUser ? "block" : "none";
      if (authUser) loadAccountInvites();
    }
    function closeAuthModal() { document.getElementById("auth-modal").classList.remove("open"); }
    async function signIn() { await authenticate("signInWithPassword"); }
    async function signUp() { await authenticate("signUp"); }
    async function signInWithGoogle() {
      if (!supabaseClient) return alert("Add Supabase environment variables to enable accounts.");
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: window.location.origin }
      });
      if (error) document.getElementById("auth-status").textContent = error.message;
    }
    async function authenticate(method) {
      if (!supabaseClient) return alert("Add Supabase environment variables to enable accounts.");
      const email = document.getElementById("auth-email").value.trim();
      const password = document.getElementById("auth-password").value;
      const result = await supabaseClient.auth[method]({ email, password });
      document.getElementById("auth-status").textContent = result.error ? result.error.message : "Success. Check your email if confirmation is enabled.";
      if (!result.error && method === "signInWithPassword") closeAuthModal();
    }
    async function signOut() {
      if (supabaseClient) await supabaseClient.auth.signOut();
      authUser = null; closeAuthModal(); location.reload();
    }
    async function loadAccountInvites() {
      const target = document.getElementById("account-invites");
      if (!authUser?.email) return;
      const { data, error } = await supabaseClient.from("board_invitations").select("id, board_id, role, boards(name)").eq("email", authUser.email.toLowerCase()).is("accepted_at", null);
      if (error) {
        target.innerHTML = `<span class="status-text">${error.message}</span>`;
        return;
      }
      target.innerHTML = (data || []).map((invite) => `<div class="invite-row"><span>${invite.boards?.name || "Board"}<br><small>${invite.role}</small></span><button onclick="acceptInvite('${invite.id}')">Accept</button></div>`).join("");
    }
    async function acceptInvite(invitationId) {
      const { error } = await supabaseClient.rpc("accept_board_invitation", { invitation_id: invitationId });
      if (error) return alert(error.message);
      closeAuthModal();
      await loadSupabaseState();
      renderBoard();
    }

    async function openInviteModal() {
      if (!supabaseClient || !authUser) return alert("Sign in to invite members.");
      const role = boardMemberships[getActiveBoard().id]?.role;
      if (role !== "owner") return alert("Only the board owner can manage invitations.");
      document.getElementById("invite-modal").classList.add("open");
      const { data, error } = await supabaseClient.from("board_invitations").select("id, email, role, created_at").eq("board_id", getActiveBoard().id).is("accepted_at", null);
      if (error) {
        document.getElementById("invite-status").textContent = error.message;
        return;
      }
      document.getElementById("pending-invites").innerHTML = (data || []).map((invite) => `<div class="invite-row"><span>${invite.email}<br><small>${invite.role}</small></span></div>`).join("") || '<span class="status-text">No pending invitations.</span>';
    }
    function closeInviteModal() { document.getElementById("invite-modal").classList.remove("open"); }
    async function sendInvite() {
      const board = getActiveBoard();
      const email = document.getElementById("invite-email").value.trim().toLowerCase();
      const role = document.getElementById("invite-role").value;
      if (!email) return;
      const { error } = await supabaseClient.from("board_invitations").insert({ board_id: board.id, email, role, invited_by: authUser.id });
      document.getElementById("invite-status").textContent = error ? error.message : "Invitation created. The member will see it after signing in.";
      if (!error) openInviteModal();
    }

    // --- 6. RENDERING ---
    function linkifyText(str) {
      const escaped = str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
      return escaped.replace(
        /(https?:\/\/[^\s]+)/g,
        '<a href="$1" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">$1</a>'
      );
    }

    function renderBoard() {
      const board = getActiveBoard();
      const select = document.getElementById("board-select");
      select.innerHTML = state.boards
        .map((b) => `<option value="${b.id}" ${b.id === board.id ? "selected" : ""}>${b.name}</option>`)
        .join("");

      document.body.style.backgroundImage = board.background ? `url('${board.background}')` : "none";

      const canvas = document.getElementById("board-canvas");
      canvas.innerHTML = "";

      board.lists.forEach((list) => {
        const listEl = document.createElement("div");
        listEl.className = "list";
        listEl.draggable = true;
        listEl.dataset.listId = list.id;

        listEl.innerHTML = `
          <div class="list-header">
            <span class="list-title" onclick="renameList('${list.id}')">${list.name}</span>
            <div class="list-meta">
              <span>${list.cards.length}</span>
              <button class="icon-btn" title="Delete List" onclick="deleteList('${list.id}')">⋯</button>
            </div>
          </div>
          <div class="cards-container" data-list-id="${list.id}"></div>
          <button class="add-card-btn" onclick="showAddCardForm('${list.id}', this)">+ Add a card</button>
        `;

        const container = listEl.querySelector(".cards-container");

        listEl.addEventListener("dragstart", (event) => {
          if (draggedCardRef) {
            event.preventDefault();
            return;
          }
          draggedListId = list.id;
          listEl.classList.add("list-dragging");
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", list.id);
        });
        listEl.addEventListener("dragend", () => {
          listEl.classList.remove("list-dragging");
          document.querySelectorAll(".list-drag-over").forEach((element) => element.classList.remove("list-drag-over"));
          draggedListId = null;
        });
        listEl.addEventListener("dragover", (event) => {
          if (!draggedListId) return;
          event.preventDefault();
          event.dataTransfer.dropEffect = "move";
          listEl.classList.add("list-drag-over");
        });
        listEl.addEventListener("dragleave", (event) => {
          if (!listEl.contains(event.relatedTarget)) listEl.classList.remove("list-drag-over");
        });
        listEl.addEventListener("drop", (event) => handleDropOnListColumn(event, list.id));

        // Drag and Drop events on container
        container.addEventListener("dragover", (e) => {
          if (draggedListId) return;
          e.preventDefault();
          container.classList.add("drag-over");
        });
        container.addEventListener("dragleave", () => container.classList.remove("drag-over"));
        container.addEventListener("drop", (e) => {
          if (draggedListId) return;
          e.stopPropagation();
          handleDropOnList(e, list.id);
        });

        list.cards.forEach((card) => {
          const cardEl = document.createElement("div");
          cardEl.className = "card";
          cardEl.draggable = true;
          cardEl.dataset.cardId = card.id;

          cardEl.addEventListener("dragstart", (e) => {
            e.stopPropagation();
            draggedCardRef = { sourceListId: list.id, cardId: card.id };
            cardEl.classList.add("dragging");
          });
          cardEl.addEventListener("dragend", () => {
            cardEl.classList.remove("dragging");
            draggedCardRef = null;
          });
          cardEl.addEventListener("click", () => openCardModal(list.id, card.id));

          const duePill = getDuePillInfo(card);
          const totalCheck = (card.checklist || []).length;
          const doneCheck = (card.checklist || []).filter((i) => i.done).length;
          const hasDesc = Boolean(card.description && card.description.trim());
          const linksCount = (card.links || []).length;

          cardEl.innerHTML = `
            ${card.coverImage ? `<img class="card-cover" src="${card.coverImage}" alt="Link preview" onerror="this.style.display='none'" />` : ""}
            <div class="card-header-row">
              <div class="complete-toggle ${card.completed ? "completed" : ""}" onclick="toggleCardComplete(event, '${list.id}', '${card.id}')">
                ${card.completed ? "✓" : ""}
              </div>
              <div class="card-title">${linkifyText(card.title)}</div>
            </div>
            ${
              duePill || totalCheck > 0 || hasDesc || linksCount > 0
                ? `<div class="card-badges">
                    ${duePill ? `<span class="${duePill.className}">${duePill.text}</span>` : ""}
                    ${hasDesc ? `<span class="badge-item" title="Has description">≡</span>` : ""}
                    ${linksCount > 0 ? `<span class="badge-item" title="Attached links">🔗 ${linksCount}</span>` : ""}
                    ${totalCheck > 0 ? `<span class="badge-item">☑ ${doneCheck}/${totalCheck}</span>` : ""}
                  </div>`
                : ""
            }
          `;

          container.appendChild(cardEl);
        });

        canvas.appendChild(listEl);
      });

      const addListBtn = document.createElement("button");
      addListBtn.className = "add-list-btn";
      addListBtn.textContent = "+ Add another list";
      addListBtn.onclick = createNewList;
      canvas.appendChild(addListBtn);
    }

    async function handleDropOnListColumn(event, targetListId) {
      event.preventDefault();
      event.stopPropagation();
      if (!draggedListId || draggedListId === targetListId) return;

      const board = getActiveBoard();
      const sourceIndex = board.lists.findIndex((list) => list.id === draggedListId);
      const targetIndex = board.lists.findIndex((list) => list.id === targetListId);
      if (sourceIndex === -1 || targetIndex === -1) return;

      const [movedList] = board.lists.splice(sourceIndex, 1);
      const targetElement = event.currentTarget;
      const targetBox = targetElement.getBoundingClientRect();
      const insertIndex = event.clientX < targetBox.left + targetBox.width / 2 ? targetIndex : targetIndex + 1;
      board.lists.splice(sourceIndex < insertIndex ? insertIndex - 1 : insertIndex, 0, movedList);
      draggedListId = null;
      await saveState();
      renderBoard();
    }

    // --- 7. CARD & LIST ACTIONS ---
    function showAddCardForm(listId, btnEl) {
      const form = document.createElement("div");
      form.className = "add-card-form";
      form.innerHTML = `
        <textarea placeholder="Enter card title (e.g. 'catchup db lec 26/10 16:10' or 'wash hair tomorrow')..."></textarea>
        <div class="row">
          <button class="submit-btn">Add card</button>
          <button class="cancel-btn">Cancel</button>
        </div>
      `;
      btnEl.replaceWith(form);
      const textarea = form.querySelector("textarea");
      textarea.focus();

      const submit = async () => {
        const raw = textarea.value.trim();
        if (!raw) return renderBoard();

        const board = getActiveBoard();
        const list = board.lists.find((l) => l.id === listId);

        // Automation 1: Natural language date extraction
        const { cleanTitle, dueISO } = parseNaturalLanguageDate(raw);
        const detectedUrls = extractUrls(raw);

        const newCard = {
          id: "card-" + Date.now() + Math.random().toString(36).slice(2, 6),
          title: cleanTitle,
          description: "",
          due: dueISO,
          completed: false,
          checklist: [],
          links: detectedUrls,
          coverImage: null
        };

        list.cards.push(newCard);

        // Automation 3: When a due date is set on a card, sort the list by due date ascending
        if (dueISO) {
          sortListByDueAscending(list);
        }

        await saveState();
        renderBoard();
        runDueMomentAutomations();
        enrichCardWithLinkPreview(newCard);
      };

      form.querySelector(".submit-btn").onclick = submit;
      form.querySelector(".cancel-btn").onclick = renderBoard;
      textarea.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          submit();
        } else if (e.key === "Escape") {
          renderBoard();
        }
      });
    }

    async function toggleCardComplete(event, listId, cardId) {
      event.stopPropagation();
      const board = getActiveBoard();
      const sourceList = board.lists.find((l) => l.id === listId);
      const idx = sourceList.cards.findIndex((c) => c.id === cardId);
      if (idx === -1) return;

      const card = sourceList.cards[idx];
      card.completed = !card.completed;

      // Automation 2: When marked as complete, move the card to the top of list "Done"
      if (card.completed) {
        sourceList.cards.splice(idx, 1);
        const doneList = ensureListByName(board, "Done", false);
        doneList.cards.unshift(card);
      }

      await saveState();
      renderBoard();
    }

    async function handleDropOnList(event, targetListId) {
      event.preventDefault();
      if (!draggedCardRef) return;

      const board = getActiveBoard();
      const sourceList = board.lists.find((l) => l.id === draggedCardRef.sourceListId);
      const targetList = board.lists.find((l) => l.id === targetListId);
      if (!sourceList || !targetList) return;

      const cardIdx = sourceList.cards.findIndex((c) => c.id === draggedCardRef.cardId);
      if (cardIdx === -1) return;

      const [movedCard] = sourceList.cards.splice(cardIdx, 1);

      // Calculate drop position based on mouse Y
      const container = event.currentTarget;
      const cardElements = [...container.querySelectorAll(".card:not(.dragging)")];
      let insertIndex = targetList.cards.length;

      for (let i = 0; i < cardElements.length; i++) {
        const box = cardElements[i].getBoundingClientRect();
        if (event.clientY < box.top + box.height / 2) {
          insertIndex = i;
          break;
        }
      }

      targetList.cards.splice(insertIndex, 0, movedCard);
      await saveState();
      renderBoard();
    }

    // --- 8. MODAL DETAIL VIEW ---
    function findActiveCard() {
      if (!activeCardRef) return null;
      const board = getActiveBoard();
      const list = board.lists.find((l) => l.id === activeCardRef.listId);
      if (!list) return null;
      const card = list.cards.find((c) => c.id === activeCardRef.cardId);
      return { board, list, card };
    }

    function openCardModal(listId, cardId) {
      activeCardRef = { listId, cardId };
      const ctx = findActiveCard();
      if (!ctx || !ctx.card) return;
      const { card } = ctx;

      document.getElementById("modal-title").value = card.title;
      document.getElementById("modal-due").value = card.due || "";
      document.getElementById("modal-desc").value = card.description || "";
      renderModalLinksAndChecklist();
      document.getElementById("card-modal").classList.add("open");
    }

    function renderModalLinksAndChecklist() {
      const ctx = findActiveCard();
      if (!ctx || !ctx.card) return;
      const { card } = ctx;

      // Clickable links found in description
      const descUrls = extractUrls(card.description);
      const descLinksEl = document.getElementById("modal-desc-links");
      descLinksEl.innerHTML = descUrls.length
        ? "Links in description: " + descUrls.map((u) => `<a href="${u}" target="_blank" style="color:#579dff">${u}</a>`).join(" , ")
        : "";

      // Attached links list
      const linksList = document.getElementById("modal-links-list");
      linksList.innerHTML = (card.links || [])
        .map(
          (u, idx) => `
          <div class="row" style="justify-content:space-between; background:#222528; padding:6px 10px; border-radius:6px;">
            <a href="${u}" target="_blank" style="color:#579dff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:420px;">${u}</a>
            <button onclick="removeCardLink(${idx})">✕</button>
          </div>`
        )
        .join("");

      // Checklist
      const checklist = card.checklist || [];
      const doneCount = checklist.filter((i) => i.done).length;
      document.getElementById("modal-checklist-label").textContent = `Checklist (${doneCount}/${checklist.length})`;

      const itemsEl = document.getElementById("modal-checklist-items");
      itemsEl.innerHTML = checklist
        .map(
          (item, i) => `
          <div class="checklist-item ${item.done ? "done" : ""}">
            <input type="checkbox" ${item.done ? "checked" : ""} onchange="toggleChecklistItem(${i})" />
            <span style="flex:1">${linkifyText(item.text)}</span>
            <button class="icon-btn" onclick="deleteChecklistItem(${i})">✕</button>
          </div>`
        )
        .join("");
    }

    async function saveModalTitle() {
      const ctx = findActiveCard();
      if (!ctx) return;
      const raw = document.getElementById("modal-title").value.trim();
      if (!raw) return;

      const { cleanTitle, dueISO } = parseNaturalLanguageDate(raw);
      ctx.card.title = cleanTitle;
      if (dueISO) {
        ctx.card.due = dueISO;
        document.getElementById("modal-due").value = dueISO;
        sortListByDueAscending(ctx.list);
      }
      await saveState();
      renderBoard();
      enrichCardWithLinkPreview(ctx.card);
    }

    async function updateModalDue(val) {
      const ctx = findActiveCard();
      if (!ctx) return;
      ctx.card.due = val || null;
      document.getElementById("modal-due").value = val || "";
      if (ctx.card.due) {
        sortListByDueAscending(ctx.list);
      }
      await saveState();
      renderBoard();
      runDueMomentAutomations();
    }

    async function saveModalDesc() {
      const ctx = findActiveCard();
      if (!ctx) return;
      ctx.card.description = document.getElementById("modal-desc").value;
      await saveState();
      renderModalLinksAndChecklist();
      renderBoard();
      enrichCardWithLinkPreview(ctx.card);
    }

    async function addCardLink() {
      const ctx = findActiveCard();
      if (!ctx) return;
      const input = document.getElementById("modal-link-input");
      let url = input.value.trim();
      if (!url) return;
      if (!/^https?:\/\//i.test(url)) url = "https://" + url;

      ctx.card.links = ctx.card.links || [];
      ctx.card.links.push(url);
      input.value = "";
      await saveState();
      renderModalLinksAndChecklist();
      renderBoard();
      await enrichCardWithLinkPreview(ctx.card);
    }

    async function removeCardLink(idx) {
      const ctx = findActiveCard();
      if (!ctx) return;
      ctx.card.links.splice(idx, 1);
      ctx.card.coverImage = null;
      await saveState();
      renderModalLinksAndChecklist();
      renderBoard();
      await enrichCardWithLinkPreview(ctx.card);
    }

    async function addChecklistItem() {
      const ctx = findActiveCard();
      if (!ctx) return;
      const input = document.getElementById("new-check-item");
      const text = input.value.trim();
      if (!text) return;
      ctx.card.checklist = ctx.card.checklist || [];
      ctx.card.checklist.push({ text, done: false });
      input.value = "";
      await saveState();
      renderModalLinksAndChecklist();
      renderBoard();
    }

    async function toggleChecklistItem(idx) {
      const ctx = findActiveCard();
      if (!ctx) return;
      ctx.card.checklist[idx].done = !ctx.card.checklist[idx].done;
      await saveState();
      renderModalLinksAndChecklist();
      renderBoard();
    }

    async function deleteChecklistItem(idx) {
      const ctx = findActiveCard();
      if (!ctx) return;
      ctx.card.checklist.splice(idx, 1);
      await saveState();
      renderModalLinksAndChecklist();
      renderBoard();
    }

    async function deleteActiveCard() {
      const ctx = findActiveCard();
      if (!ctx) return;
      ctx.list.cards = ctx.list.cards.filter((c) => c.id !== ctx.card.id);
      closeModal();
      await saveState();
      renderBoard();
    }

    function closeModal() {
      document.getElementById("card-modal").classList.remove("open");
      activeCardRef = null;
    }

    // --- 9. BOARD, LIST & BACKGROUND MANAGEMENT ---
    async function createNewList() {
      const name = prompt("List name:");
      if (!name || !name.trim()) return;
      const board = getActiveBoard();
      board.lists.push({
        id: "list-" + Date.now(),
        name: name.trim(),
        cards: []
      });
      await saveState();
      renderBoard();
    }

    async function renameList(listId) {
      const board = getActiveBoard();
      const list = board.lists.find((l) => l.id === listId);
      if (!list) return;
      const next = prompt("Rename list:", list.name);
      if (next && next.trim()) {
        list.name = next.trim();
        await saveState();
        renderBoard();
      }
    }

    async function deleteList(listId) {
      if (!confirm("Delete this list and its cards?")) return;
      const board = getActiveBoard();
      board.lists = board.lists.filter((l) => l.id !== listId);
      await saveState();
      renderBoard();
    }

    async function createNewBoard() {
      const name = prompt("New board name:");
      if (!name || !name.trim()) return;
      const lists = [
        { id: "list-1-" + Date.now(), name: "DUE TODAY", cards: [] },
        { id: "list-2-" + Date.now(), name: "To Do", cards: [] },
        { id: "list-3-" + Date.now(), name: "Done", cards: [] }
      ];
      if (supabaseClient && authUser) {
        const { data, error } = await supabaseClient.rpc("create_board", {
          board_name: name.trim(), board_background: "", board_data: { lists }
        });
        if (error) return alert(error.message);
        boardMemberships[data.id] = { role: "owner" };
        state.boards.push({ id: data.id, name: data.name, background: "", lists });
        state.activeBoardId = data.id;
        rememberActiveBoard(data.id);
        renderBoard();
        return;
      }
      const newBoard = {
        id: "board-" + Date.now(),
        name: name.trim(),
        background: "",
        lists
      };
      state.boards.push(newBoard);
      state.activeBoardId = newBoard.id;
      rememberActiveBoard(newBoard.id);
      await saveState();
      renderBoard();
    }

    async function switchBoard(boardId) {
      state.activeBoardId = boardId;
      rememberActiveBoard(boardId);
      renderBoard();
    }

    async function deleteCurrentBoard() {
      if (state.boards.length <= 1) {
        alert("You must keep at least one board.");
        return;
      }
      if (!confirm("Delete current board?")) return;
      if (supabaseClient && authUser) {
        const role = boardMemberships[state.activeBoardId]?.role;
        if (role !== "owner") return alert("Only the board owner can delete this board.");
        const { error } = await supabaseClient.from("boards").delete().eq("id", state.activeBoardId);
        if (error) return alert(error.message);
        delete boardMemberships[state.activeBoardId];
      }
      state.boards = state.boards.filter((b) => b.id !== state.activeBoardId);
      state.activeBoardId = state.boards[0].id;
      rememberActiveBoard(state.activeBoardId);
      await saveState();
      renderBoard();
    }

    async function uploadBackground(input) {
      const file = input.files[0];
      if (!file) return;
      const board = getActiveBoard();
      if (supabaseClient && authUser) {
        const membership = boardMemberships[board.id];
        if (!membership || !["owner", "editor"].includes(membership.role)) {
          input.value = "";
          return alert("You do not have permission to change this board background.");
        }
        const extension = (file.name.split(".").pop() || "jpg").replace(/[^a-z0-9]/gi, "").toLowerCase() || "jpg";
        const path = `${authUser.id}/${board.id}-${Date.now()}.${extension}`;
        const upload = await supabaseClient.storage.from("board-backgrounds").upload(path, file, { upsert: true, contentType: file.type });
        if (upload.error) {
          input.value = "";
          return alert(`Background upload failed: ${upload.error.message}`);
        }
        const publicUrl = supabaseClient.storage.from("board-backgrounds").getPublicUrl(path).data.publicUrl;
        board.background = publicUrl;
        await saveState();
        input.value = "";
        renderBoard();
        return;
      }
      const reader = new FileReader();
      reader.onload = async (e) => {
        const res = await fetch("/api/upload-bg", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ filename: file.name, data: e.target.result })
        });
        const data = await res.json();
        if (data.url) {
          board.background = data.url;
          await saveState();
          renderBoard();
        }
      };
      reader.readAsDataURL(file);
    }

    async function clearBackground() {
      const board = getActiveBoard();
      board.background = "";
      await saveState();
      renderBoard();
    }

    // Periodically check every 30s if any card has hit its due moment
    setInterval(runDueMomentAutomations, 30000);

    loadState();
  </script>
</body>
</html>
